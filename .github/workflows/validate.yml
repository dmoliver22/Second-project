name: Validate data

on:
  pull_request:
  push:
    paths: ["data/**", "scripts/**", "js/**", "index.html"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_data.py
      - run: python3 scripts/build.py
