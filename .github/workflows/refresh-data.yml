name: Refresh live data

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Steam reviews and prices
        run: python3 scripts/refresh_steam.py
      - name: Validate data
        run: python3 scripts/validate_data.py
      - name: Rebuild single-file dashboard
        run: python3 scripts/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data dist
          git diff --cached --quiet || git commit -m "Refresh live Steam data ($(date -u +%F))"
          git push
